<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Weather Dashboard using Fetch API and Async JavaScript">

    <meta name="keywords"
          content="Weather App, JavaScript, API, Fetch API">

    <meta name="author"
          content="Pushpendra Singh">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header>

        <h1>🌤 Weather Dashboard</h1>

        <p>
            Search any city to get live weather information
        </p>

    </header>



    <!-- Search Box -->

    <section class="search-section">

        <input
            type="text"
            id="cityInput"
            placeholder="Enter City Name"
            aria-label="City Name">

        <button id="searchBtn">

            Search

        </button>

    </section>



    <!-- Loading -->

    <div
        id="loading"
        class="loading">

        Loading Weather...

    </div>



    <!-- Error Message -->

    <div
        id="error"
        class="error">

    </div>



    <!-- Weather Card -->

    <section
        id="weatherCard"
        class="weather-card">

        <h2 id="cityName">

            City Name

        </h2>

        <p id="currentDate">

            Date

        </p>

        <img
            id="weatherIcon"
            src=""
            alt="Weather Icon">

        <h1 id="temperature">

            -- °C

        </h1>

        <h3 id="weatherCondition">

            Condition

        </h3>



        <div class="weather-grid">

            <div class="weather-item">

                <h4>💧 Humidity</h4>

                <p id="humidity">

                    -- %

                </p>

            </div>



            <div class="weather-item">

                <h4>💨 Wind Speed</h4>

                <p id="windSpeed">

                    -- km/h

                </p>

            </div>



            <div class="weather-item">

                <h4>🌡 Feels Like</h4>

                <p id="feelsLike">

                    -- °C

                </p>

            </div>



            <div class="weather-item">

                <h4>👁 Visibility</h4>

                <p id="visibility">

                    -- km

                </p>

            </div>

        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>

            Built with HTML, CSS & JavaScript

        </p>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
